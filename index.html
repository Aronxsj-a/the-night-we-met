<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d1a">
  <meta name="description" content="Some nights seem ordinary... until you look back.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta property="og:type" content="website">
  <meta property="og:title" content="The Night We Met">
  <meta property="og:description" content="Some nights seem ordinary... until you look back.">
  <meta property="og:image" content="assets/social-preview.png">
  <meta property="og:image:alt" content="A crescent moon over a quiet night sky">
  <meta name="twitter:card" content="summary_large_image">
  <title>The Night We Met</title>
  <link rel="icon" href="assets/moon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="opening.css">
  <link rel="stylesheet" href="chapters.css">
  <link rel="stylesheet" href="ending.css">
  <script defer src="audio.js"></script>
  <script defer src="opening.js"></script>
  <script defer src="chapters.js"></script>
  <script defer src="ending.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <main class="desktop" aria-labelledby="desktop-title">
    <div class="desktop-card">
      <img src="assets/moon.svg" alt="" width="66" height="66">
      <p class="eyebrow">The Night We Met</p>
      <h1 id="desktop-title">Open on<br>your phone.</h1>
      <p>This story is meant to be held in portrait.</p>
    </div>
  </main>

  <main id="phone" class="phone" aria-label="The Night We Met">
    <div id="stage" class="stage"></div>
    <header id="hud" class="hud" hidden>
      <button class="hud-button" id="sky-button" type="button" aria-label="Open chapter navigator">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 17l6-11 4 8 6-5"/><circle cx="4" cy="17" r="1.6" fill="currentColor"/><circle cx="10" cy="6" r="1.6" fill="currentColor"/><circle cx="14" cy="14" r="1.6" fill="currentColor"/><circle cx="20" cy="9" r="1.6" fill="currentColor"/></svg>
      </button>
      <span id="chapter-label" class="hud-label"></span>
      <button class="hud-button" id="menu-button" type="button" aria-label="Open story settings">
        <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/><circle cx="9" cy="7" r="2" fill="#111424"/><circle cx="15" cy="12" r="2" fill="#111424"/><circle cx="10" cy="17" r="2" fill="#111424"/></svg>
      </button>
    </header>
    <div id="progress" class="progress" aria-hidden="true" hidden></div>
    <dialog id="overlay" class="overlay" aria-labelledby="overlay-title"></dialog>
  </main>
  <noscript><p class="no-script">Enable JavaScript to play The Night We Met.</p></noscript>
</body>
</html>
